<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Soul - Menus</title>
    <style>
        /* Genel Sayfa Ayarları (Koyu Tema) */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117; /* Koyu gri/siyah arka plan */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        /* Başlıkların ve Butonların Duracağı Ana Kutu */
        .container {
            background: rgba(22, 27, 34, 0.8);
            padding: 40px 60px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            max-width: 500px;
            width: 100%;
        }

        /* Üst Yazı: Created by drift soul */
        .created-by {
            font-size: 1.2rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        /* Alt Yazı: Best hack menus web */
        .main-title {
            font-size: 2.5rem;
            color: #58a6ff; /* Canlı mavi tonu */
            font-weight: bold;
            text-transform: capitalize;
            margin: 0;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
            margin-bottom: 20px;
        }

        /* Butonların Alanı */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Butonlar arasındaki boşluk */
            margin-top: 25px;
        }

        /* Genel Buton Tasarımı */
        .menu-button {
            display: block;
            padding: 14px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .menu-button:hover {
            transform: translateY(-2px); /* Hafif yukarı kalkma efekti */
        }

        /* YimmenuV2 - Yeşil Buton */
        .yim-btn {
            background-color: #238636;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.3);
        }
        .yim-btn:hover {
            background-color: #2ea44f;
            box-shadow: 0 4px 20px rgba(46, 164, 79, 0.5);
        }

        /* Xenos İnjektor - Mavi/Gri Buton */
        .xenos-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .xenos-btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            color: #58a6ff; /* Üzerine gelince yazı mavi olur */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="created-by">Created by drift soul</div>
        <h1 class="main-title">Best hack menus web</h1>
        
        <!-- Buton Grubu -->
        <div class="button-group">
            <!-- YimmenuV2 Butonu -->
            <a href="https://github.com/YimMenu/YimMenuV2" target="_blank" class="menu-button yim-btn">YimmenuV2</a>
            
            <!-- Xenos İnjektor Butonu -->
            <a href="https://github.com/DarthTon/Xenos" target="_blank" class="menu-button xenos-btn">Xenos İnjektor</a>
        </div>
    </div>

</body>
</html>
