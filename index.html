<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drift Soul - Menus</title>
    <style>
        /* Genel Sayfa Ayarları (Koyu Tema) */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117; /* Koyu gri/siyah arka plan */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Başlıkların ve Butonun Duracağı Ana Kutu */
        .container {
            background: rgba(22, 27, 34, 0.8);
            padding: 40px 60px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        /* Üst Yazı: Created by drift soul */
        .created-by {
            font-size: 1.2rem;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        /* Alt Yazı: Best hack menus web */
        .main-title {
            font-size: 2.5rem;
            color: #58a6ff; /* Canlı mavi tonu */
            font-weight: bold;
            text-transform: capitalize;
            margin: 0;
            text-shadow: 0 0 10px rgba(88, 166, 255, 0.3);
        }

        /* YimmenuV2 Buton Stili */
        .menu-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 35px;
            background-color: #238636; /* Yeşil renk */
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(35, 134, 54, 0.3);
            transition: all 0.2s ease;
        }

        /* Butonun üzerine gelindiğinde olacak efekt */
        .menu-button:hover {
            background-color: #2ea44f; /* Daha açık yeşil */
            box-shadow: 0 4px 20px rgba(46, 164, 79, 0.5);
            transform: translateY(-2px); /* Hafif yukarı kalkma efekti */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="created-by">Created by drift soul</div>
        <h1 class="main-title">Best hack menus web</h1>
        
        <a href="https://github.com/YimMenu/YimMenuV2" target="_blank" class="menu-button">YimmenuV2</a>
    </div>

</body>
</html>
